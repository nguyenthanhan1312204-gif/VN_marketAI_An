name: VN Market Daily Report

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Agent
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit latest snapshot & report (để bot Q&A đọc được)
        if: always()
        run: |
          git config user.name "vn-market-bot"
          git config user.email "actions@github.com"
          git add snapshots/ reports/
          git diff --cached --quiet || git commit -m "chore: update market snapshot ${{ github.run_id }} [skip ci]"
          git pull --rebase
          git push

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-report-${{ github.run_id }}
          path: |
            snapshots/
            reports/
          retention-days: 30
